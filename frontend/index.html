<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema da Loja</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- TELA DE LOGIN -->
  <section id="tela-login">
    <form id="form-login" class="card-login">
      <h1>Sistema da Loja</h1>
      <p>Acesso das sócias</p>
      <div id="login-erro" class="msg erro oculto"></div>
      <label style="text-align:left">E-mail</label>
      <input id="login-email" type="email" required autocomplete="username">
      <label style="text-align:left">Senha</label>
      <input id="login-senha" type="password" required autocomplete="current-password">
      <button class="btn" style="width:100%" type="submit">Entrar</button>
    </form>
  </section>

  <!-- APP -->
  <section id="tela-app" class="oculto">
    <header>
      <h1>👗 Sistema da Loja</h1>
      <button id="btn-sair" class="btn btn-sec">Sair</button>
    </header>
    <nav>
      <button data-pg="dashboard" class="ativo">Painel</button>
      <button data-pg="produtos">Produtos</button>
      <button data-pg="vendas">Vendas</button>
      <button data-pg="clientes">Clientes</button>
      <button data-pg="relatorios">Relatórios</button>
    </nav>
    <main id="view"></main>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
